<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Miss Direction Owner</title>
<style>
  :root{--bg:#f4efe1;--paper:#fffdf6;--ink:#1a1814;--muted:#4a453b;--line:rgba(26,24,20,.25);--hot:#ffe27a}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Libre Franklin",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;background:var(--bg);border-bottom:3px double var(--ink);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:2}
  h1{font:900 1.3rem "Playfair Display",Georgia,serif;margin:0} main{max-width:900px;margin:0 auto;padding:16px}
  button{font:700 .9rem inherit;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:3px;padding:6px 12px;cursor:pointer}
  button.primary{background:var(--hot)}
  .muted{color:var(--muted)} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .stat{background:var(--paper);border:2px solid var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.25);padding:12px 14px}
  .stat b{display:block;font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat span{color:var(--muted);font-size:.85rem}
  table{border-collapse:collapse;width:100%;background:var(--paper);border:2px solid var(--ink);margin-bottom:14px}
  td,th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem;font-variant-numeric:tabular-nums} th{color:var(--muted);font-weight:600}
  h2{font-size:1.05rem;margin:18px 0 8px}
  .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
</style>
</head>
<body>
<header>
  <h1>Miss Direction owner</h1>
  <div class="row"><span id="who" class="muted"></span><button id="signin" class="primary" hidden>Sign in with Google</button><button id="signout" hidden>Sign out</button></div>
</header>
<main>
  <p id="msg" class="muted">Loading…</p>
  <section id="usage" hidden></section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG = {"apiKey":"AIzaSyAlbSCTpAiK-1tojkyWrY3QuJsSzILHSfs","authDomain":"aislerun-88e79.firebaseapp.com","projectId":"aislerun-88e79","storageBucket":"aislerun-88e79.firebasestorage.app","messagingSenderId":"589354345822","appId":"1:589354345822:web:c254c32c792212af381bcf"};
const $=s=>document.querySelector(s), esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let DEV=[];
firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth(), db=firebase.firestore();
$("#signin").onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{$("#msg").textContent="Sign-in didn't work: "+e.message;});
$("#signout").onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{
  $("#signin").hidden=!!u; $("#signout").hidden=!u; $("#who").textContent=u?u.email:""; $("#usage").hidden=true;
  if(!u){ $("#msg").textContent="Sign in with the Google account that owns Miss Direction to see how many devices play."; return; }
  $("#msg").textContent="Loading…";
  try{
    const ds=await db.collection("md_devices").limit(10000).get();
    DEV=ds.docs.map(d=>({id:d.id,...d.data()}));
    $("#msg").textContent=""; draw(); $("#usage").hidden=false;
  }catch(e){ $("#msg").textContent = e.code==="permission-denied" ? "This account can't view usage. Only the owner can." : "Couldn't load usage: "+e.message; }
});
const dayStr=d=>d.toLocaleDateString("en-CA",{timeZone:"America/New_York"}), ago=n=>dayStr(new Date(Date.now()-n*864e5)), num=n=>Number(n||0).toLocaleString();
function draw(){
  const today=dayStr(new Date()), w=ago(6), m=ago(29), cnt=f=>DEV.filter(f).length, sum=k=>DEV.reduce((a,d)=>a+(+d[k]||0),0);
  const tallyBy=k=>{const t={}; DEV.filter(d=>d.last>=m).forEach(d=>{const v=k==="desk"?(d.desk?"Computer":"Phone"):String(d[k]??"?"); t[v]=(t[v]||0)+1;}); return Object.entries(t).sort((a,b)=>b[1]-a[1]);};
  const stat=(n,l)=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`;
  // o = opens per day; p = games started; f = first plays finished
  const has=(k,d)=>cnt(x=>x[k]&&x[k][d]!=null), tot=(k,d)=>DEV.reduce((a,x)=>a+(x[k]&&+x[k][d]||0),0);
  const days=[]; for(let i=0;i<14;i++){ const d=ago(i); days.push([d,has("o",d),tot("o",d),has("p",d),tot("f",d),cnt(x=>x.first===d)]); }
  const tbl=(title,rows)=>`<div><h2>${title}</h2><table>${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${num(v)}</td></tr>`).join("")||`<tr><td class="muted">None yet</td><td></td></tr>`}</table></div>`;
  $("#usage").innerHTML=`<div class="stats">${stat(has("o",today),"opened today")}${stat(has("p",today),"played today")}${stat(tot("f",today),"finished today")}${stat(cnt(d=>d.last>=w),"active this week")}${stat(cnt(d=>d.last>=m),"active this month")}${stat(DEV.length,"devices ever")}${stat(cnt(d=>d.first>=w),"new this week")}${stat(num(sum("done")),"games finished ever")}</div>
  <p class="muted">Counts phones and computers, not people. Days are Eastern time. A device checks in when it opens the game, starts a game and finishes a first play, from smaisle.app only. The Claude copy isn't counted.</p>
  <h2>Last 14 days</h2><div style="overflow-x:auto"><table><tr><th>Day</th><th>Opened</th><th>Opens</th><th>Played</th><th>Finished</th><th>New</th></tr>${days.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</table></div>
  <div class="two">
  ${tbl("Streaks, active this month",[["3+ days",cnt(d=>d.last>=m&&+d.streak>=3)],["7+ days",cnt(d=>d.last>=m&&+d.streak>=7)]])}
  ${tbl("App version, active this month",tallyBy("v").map(([k,v])=>["Version "+k,v]))}
  ${tbl("Device, active this month",tallyBy("desk"))}
  </div>`;
}
</script>
</body>
</html>
